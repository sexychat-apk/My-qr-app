
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My UPI QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0d1117;color:#f0f6fc;font-family:Arial,sans-serif}
.container{max-width:480px;margin:35px auto;background:#161b22;padding:24px;border:1px solid #30363d;border-radius:16px}
h1{text-align:center;color:#58a6ff}
p{color:#9daaba;text-align:center}
label{display:block;margin-top:17px;margin-bottom:7px}
input{width:100%;padding:13px;border-radius:8px;border:1px solid #39495d;background:#0d1117;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:8px;background:#238636;color:white;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{opacity:.9}
#result{margin-top:25px;background:white;color:#111;border-radius:10px;padding:18px;text-align:center;overflow-wrap:anywhere}
#qrcode{display:flex;justify-content:center;margin:15px auto}
#qrcode img,#qrcode canvas{max-width:100%;height:auto!important}
#link{font-size:12px;color:#164e8b}
.hidden{display:none}
.note{font-size:12px}
</style>
</head>
<body>
<div class="container">
<h1>My UPI QR</h1>
<p>Apni UPI ID aur amount daalo</p>

<label for="upi">UPI ID *</label>
<input id="upi" placeholder="yourname@okaxis" required>

<label for="name">Your Name</label>
<input id="name" placeholder="Your name">

<label for="amount">Amount (₹)</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="100">

<label for="note">Payment Note</label>
<input id="note" placeholder="Payment">

<button onclick="generateQR()">Generate QR Code</button>

<div id="result" class="hidden">
<h3>Scan & Pay</h3>
<div id="qrcode"></div>
<p id="payee"></p>
<h3 id="price"></h3>
<p id="link"></p>
<button onclick="downloadQR()">Download QR Image</button>
<button onclick="copyLink()" style="background:#0969da">Copy UPI Link</button>
</div>

<p id="status"></p>
<p class="note">Payment receive hone ke baad apne UPI app mein verify zaroor karein.</p>
</div>

<script>
let paymentLink = "";

function generateQR() {
  const upi = document.getElementById("upi").value.trim();
  const name = document.getElementById("name").value.trim();
  const amount = document.getElementById("amount").value.trim();
  const note = document.getElementById("note").value.trim();
  const status = document.getElementById("status");

  if (!/^[^\\s@]+@[^\\s@]+$/.test(upi)) {
    status.textContent = "Sahi UPI ID daalo, jaise name@bank.";
    return;
  }

  if (amount && (!Number.isFinite(Number(amount)) || Number(amount) <= 0)) {
    status.textContent = "Amount zero se zyada hona chahiye.";
    return;
  }

  if (typeof QRCode === "undefined") {
    status.textContent = "QR library load nahi hui. Internet check karke refresh karo.";
    return;
  }

  const params = new URLSearchParams();
  params.set("pa", upi);
  if (name) params.set("pn", name);
  params.set("cu", "INR");
  if (amount) params.set("am", Number(amount).toFixed(2));
  if (note) params.set("tn", note);

  paymentLink = "upi://pay?" + params.toString();

  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), {
    text: paymentLink,
    width: 230,
    height: 230,
    correctLevel: QRCode.CorrectLevel.H
  });

  document.getElementById("payee").textContent =
    name ? "Pay to: " + name : "Pay using UPI";
  document.getElementById("price").textContent =
    amount ? "₹" + Number(amount).toFixed(2) : "Enter amount in your UPI app";
  document.getElementById("link").textContent = paymentLink;
  document.getElementById("result").classList.remove("hidden");
  status.textContent = "";
}

function downloadQR() {
  const canvas = document.querySelector("#qrcode canvas");
  const img = document.querySelector("#qrcode img");
  const url = canvas ? canvas.toDataURL("image/png") : img?.src;
  if (!url) return;

  const a = document.createElement("a");
  a.href = url;
  a.download = "my-upi-qr.png";
  a.click();
}

async function copyLink() {
  try {
    await navigator.clipboard.writeText(paymentLink);
    document.getElementById("status").textContent = "UPI link copied!";
  } catch (e) {
    document.getElementById("status").textContent =
      "Link ko select karke manually copy karo.";
  }
}
</script>
</body>
</html>
